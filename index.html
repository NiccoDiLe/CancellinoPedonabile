<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gate Opening</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      min-height: 100vh;

      margin: 0;
      padding: 20px;

      background: #f4f4f9;

      text-align: center;

      color: #222;
    }

    .card {
      width: 100%;
      max-width: 400px;

      background: white;

      padding: 30px 25px;

      border-radius: 18px;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    p {
      color: #555;
    }

    .slider {
      position: relative;

      width: 100%;
      height: 64px;

      margin-top: 25px;

      background: #007bff;

      border-radius: 32px;

      overflow: hidden;

      user-select: none;
      -webkit-user-select: none;
    }

    .slider-text {
      position: absolute;

      top: 50%;
      left: 0;

      width: 100%;

      transform: translateY(-50%);

      color: white;

      font-size: 18px;
      font-weight: bold;

      pointer-events: none;
    }

    .slider-handle {
      position: absolute;

      top: 6px;
      left: 6px;

      width: 52px;
      height: 52px;

      background: white;

      border-radius: 50%;

      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.25);

      display: flex;
      align-items: center;
      justify-content: center;

      color: #007bff;

      font-size: 24px;
      font-weight: bold;

      cursor: grab;

      touch-action: none;

      transition:
        left 0.1s,
        transform 0.1s;
    }

    .slider-handle:active {
      cursor: grabbing;
      transform: scale(0.96);
    }

    .slider.disabled {
      background: #bdbdbd;
    }

    .slider.disabled .slider-handle {
      cursor: not-allowed;
      color: #888;
    }

    #status {
      margin-top: 20px;

      min-height: 25px;

      font-size: 17px;

      font-weight: bold;
    }

    .ok {
      color: #198754;
    }

    .error {
      color: #dc3545;
    }

    .info {
      color: #555;
    }

  </style>

</head>


<body>

  <div class="card">

    <h1>🚪 Pedestrian Gate</h1>

    <p>
      Slide the button to open the gate.
    </p>


    <div
      id="openSlider"
      class="slider"
    >

      <div class="slider-text">
        Slide to open →
      </div>

      <div
        id="sliderHandle"
        class="slider-handle"
      >
        →
      </div>

    </div>


    <div id="status"></div>

  </div>


  <script>

    // ==========================================================
    // CLOUDFLARE WORKER
    // ==========================================================

    const WORKER_URL =
      "https://cancellino-pedonabile.batnicco2004.workers.dev/";


    // ==========================================================
    // ELEMENTI SLIDER
    // ==========================================================

    const slider =
      document.getElementById("openSlider");

    const handle =
      document.getElementById("sliderHandle");

    let dragging = false;


    // ==========================================================
    // MESSAGGIO
    // ==========================================================

    function mostraMessaggio(
      testo,
      tipo = "info"
    ) {

      const status =
        document.getElementById("status");

      status.innerText = testo;

      status.className = tipo;
    }


    // ==========================================================
    // RESET SLIDER
    // ==========================================================

    function resetSlider() {

      dragging = false;

      handle.style.left = "6px";

      slider.classList.remove("disabled");

    }


    // ==========================================================
    // LETTURA POSIZIONE CURSORE
    // ==========================================================

    function getPosition(event) {

      return event.clientX;

    }


    // ==========================================================
    // INIZIO DRAG
    // ==========================================================

    function startDrag(event) {

      if (
        slider.classList.contains("disabled")
      ) {
        return;
      }

      dragging = true;

      handle.setPointerCapture?.(
        event.pointerId
      );

      event.preventDefault();

    }


    // ==========================================================
    // MOVIMENTO SLIDER
    // ==========================================================

    function moveDrag(event) {

      if (!dragging) {
        return;
      }

      const rect =
        slider.getBoundingClientRect();

      const handleWidth =
        handle.offsetWidth;

      const max =
        rect.width -
        handleWidth -
        12;

      let x =
        getPosition(event) -
        rect.left -
        handleWidth / 2;

      x =
        Math.max(
          6,
          Math.min(x, max)
        );

      handle.style.left =
        `${x}px`;

      event.preventDefault();

    }


    // ==========================================================
    // FINE DRAG
    // ==========================================================

    function endDrag() {

      if (!dragging) {
        return;
      }

      dragging = false;

      const rect =
        slider.getBoundingClientRect();

      const handleWidth =
        handle.offsetWidth;

      const max =
        rect.width -
        handleWidth -
        12;

      const current =
        parseFloat(
          handle.style.left
        ) || 6;


      // --------------------------------------------------------
      // SLIDER COMPLETATO
      // --------------------------------------------------------

      if (
        current >= max * 0.90
      ) {

        handle.style.left =
          `${max}px`;

        apriCancello();

      } else {

        resetSlider();

      }

    }


    // ==========================================================
    // APERTURA CANCELLO
    // ==========================================================

    async function apriCancello() {

      slider.classList.add("disabled");

      mostraMessaggio(
        "Checking access...",
        "info"
      );


      // ========================================================
      // 1. CONTROLLO CONFIGURAZIONE WORKER
      // ========================================================

      if (
        !WORKER_URL ||
        WORKER_URL.includes("INSERISCI_QUI")
      ) {

        mostraMessaggio(
          "Worker configuration missing.",
          "error"
        );

        resetSlider();

        return;

      }


      // ========================================================
      // 2. LETTURA GUEST CODE DALL'URL
      // ========================================================

      const params =
        new URLSearchParams(
          window.location.search
        );

      const pass =
        params.get("pass");


      // ========================================================
      // 3. CONTROLLO PRESENZA GUEST CODE
      // ========================================================

      if (!pass) {

        mostraMessaggio(
          "Invalid link.",
          "error"
        );

        resetSlider();

        return;

      }


      // ========================================================
      // 4. INVIO AL CLOUDFLARE WORKER
      // ========================================================

      try {

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                pass: pass
              })
            }
          );


        // ======================================================
        // 5. LETTURA RISPOSTA
        // ======================================================

        let data = null;

        try {

          data =
            await response.json();

        } catch (error) {

          data = null;

        }


        // ======================================================
        // 6. ACCESSO CONSENTITO
        // ======================================================

        if (
          response.ok &&
          data &&
          data.success
        ) {

          mostraMessaggio(
            data.message ||
            "Gate opened!",
            "ok"
          );

        }


        // ======================================================
        // 7. ACCESSO NEGATO
        // ======================================================

        else {

          mostraMessaggio(
            data?.message ||
            "Access denied.",
            "error"
          );

        }


      } catch (error) {

        console.error(
          "Worker communication error:",
          error
        );

        mostraMessaggio(
          "Connection error.",
          "error"
        );

      }


      // ========================================================
      // 8. RESET SLIDER
      // ========================================================

      finally {

        resetSlider();

      }

    }


    // ==========================================================
    // EVENTI SLIDER
    // ==========================================================

    handle.addEventListener(
      "pointerdown",
      startDrag
    );

    handle.addEventListener(
      "pointermove",
      moveDrag
    );

    handle.addEventListener(
      "pointerup",
      endDrag
    );

    handle.addEventListener(
      "pointercancel",
      endDrag
    );

  </script>

</body>

</html>
