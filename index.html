      color: #555;

</head>


<body>

  <div class="card">

    <h1>🚪 Cancello pedonale</h1>

    <p>
      Premi il pulsante quando sei davanti al cancello.
    </p>

    <button
      id="btnOpen"
      onclick="apriCancello()"
    >
      APRI CANCELLO
    </button>

    <div id="status"></div>

  </div>


  <script>

    // ==========================================================
    // CONFIGURAZIONE
    // ==========================================================

    // URL DEL TUO WORKER CLOUDFLARE
    const WORKER_URL =
      "https://cancellino-pedonabile.batnicco2004.workers.dev/";


    // ==========================================================
    // COORDINATE DEL CANCELLO
    // ==========================================================

    const TARGET_LAT = 43.8206059;
    const TARGET_LON = 11.1387121;


    // Distanza massima consentita
    const MAX_DISTANCE_METERS = 75;


    // ==========================================================
    // CALCOLO DISTANZA GPS
    // ==========================================================

    function calcolaDistanza(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371000;

      const rad = Math.PI / 180;

      const dLat =
        (lat2 - lat1) * rad;

      const dLon =
        (lon2 - lon1) * rad;

      const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

      return (
        R *
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        )
      );
    }


    // ==========================================================
    // MESSAGGIO
    // ==========================================================

    function mostraMessaggio(
      testo,
      tipo = "info"
    ) {

      const status =
        document.getElementById("status");

      status.innerText = testo;

      status.className = tipo;
    }


    // ==========================================================
    // APERTURA CANCELLO
    // ==========================================================

    async function apriCancello() {

      const btn =
        document.getElementById("btnOpen");


      // --------------------------------------------------------
      // 1. CONTROLLO CONFIGURAZIONE WORKER
      // --------------------------------------------------------

      if (
        !WORKER_URL ||
        WORKER_URL.includes("INSERISCI_QUI")
      ) {

        mostraMessaggio(
          "Configurazione Worker mancante.",
          "error"
        );

        return;
      }


      // --------------------------------------------------------
      // 2. RECUPERO PASS DAL LINK
      // --------------------------------------------------------

      const params =
        new URLSearchParams(
          window.location.search
        );

      const pass =
        params.get("pass");


      if (!pass) {

        mostraMessaggio(
          "Link non valido.",
          "error"
        );

        return;
      }


      // --------------------------------------------------------
      // 3. CONTROLLO SUPPORTO GPS
      // --------------------------------------------------------

      if (!navigator.geolocation) {

        mostraMessaggio(
          "La geolocalizzazione non è supportata.",
          "error"
        );

        return;
      }


      // Disabilitiamo il pulsante durante la procedura
      btn.disabled = true;


      mostraMessaggio(
        "Verifica della posizione...",
        "info"
      );


      // --------------------------------------------------------
      // 4. RICHIESTA POSIZIONE
      // --------------------------------------------------------

      navigator.geolocation.getCurrentPosition(

        async (pos) => {

          const userLat =
            pos.coords.latitude;

          const userLon =
            pos.coords.longitude;


          // ----------------------------------------------------
          // 5. CONTROLLO GPS LOCALE
          // ----------------------------------------------------

          const distanza =
            calcolaDistanza(
              userLat,
              userLon,
              TARGET_LAT,
              TARGET_LON
            );


          if (
            distanza >
            MAX_DISTANCE_METERS
          ) {

            mostraMessaggio(
              `Sei troppo lontano (${Math.round(distanza)} m).`,
              "error"
            );

            btn.disabled = false;

            return;
          }


          // ----------------------------------------------------
          // 6. INVIO AL WORKER
          // ----------------------------------------------------

          mostraMessaggio(
            "Apertura in corso...",
            "info"
          );


          try {

            const response =
              await fetch(
                WORKER_URL,
                {
                  method: "POST",

                  headers: {
                    "Content-Type": "application/json"
                  },

                  body: JSON.stringify({
                    pass: pass,
                    lat: userLat,
                    lon: userLon
                  })
                }
              );


            // --------------------------------------------------
            // 7. LETTURA RISPOSTA WORKER
            // --------------------------------------------------

            let data = null;

            try {

              data =
                await response.json();

            } catch (error) {

              data = null;
            }


            // --------------------------------------------------
            // 8. RISULTATO
            // --------------------------------------------------

            if (
              response.ok &&
              data &&
              data.success
            ) {

              mostraMessaggio(
                "Cancello aperto!",
                "ok"
              );

            } else {

              mostraMessaggio(
                data?.message ||
                "Accesso non autorizzato.",
                "error"
              );
            }


          } catch (error) {

            console.error(
              "Errore comunicazione Worker:",
              error
            );

            mostraMessaggio(
              "Errore di connessione.",
              "error"
            );

          } finally {

            btn.disabled = false;

          }

        },


        // ------------------------------------------------------
        // ERRORE GPS
        // ------------------------------------------------------

        (error) => {

          console.error(
            "Errore GPS:",
            error
          );

          let messaggio =
            "Impossibile ottenere la posizione.";

          if (
            error.code ===
            error.PERMISSION_DENIED
          ) {

            messaggio =
              "Devi autorizzare la posizione GPS per aprire.";

          } else if (
            error.code ===
            error.POSITION_UNAVAILABLE
          ) {

            messaggio =
              "Posizione GPS non disponibile.";

          } else if (
            error.code ===
            error.TIMEOUT
          ) {

            messaggio =
              "Il rilevamento GPS ha impiegato troppo tempo.";

          }

          mostraMessaggio(
            messaggio,
            "error"
          );

          btn.disabled = false;
        },


        // ------------------------------------------------------
        // OPZIONI GPS
        // ------------------------------------------------------

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

    }

  </script>

</body>

</html>
