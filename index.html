<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gate Opening</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      min-height: 100vh;

      margin: 0;
      padding: 20px;

      background: #f4f4f9;

      text-align: center;

      color: #222;
    }

    .card {
      width: 100%;
      max-width: 400px;

      background: white;

      padding: 30px 25px;

      border-radius: 18px;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    p {
      color: #555;
    }

    /* ========================================================
       SLIDER
       ======================================================== */

    .slider {
      position: relative;

      width: 100%;
      height: 64px;

      margin-top: 25px;

      background: #007bff;

      border-radius: 32px;

      overflow: hidden;

      user-select: none;
      -webkit-user-select: none;
    }

    .slider-text {
      position: absolute;

      top: 50%;
      left: 0;

      width: 100%;

      transform: translateY(-50%);

      color: white;

      font-size: 18px;
      font-weight: bold;

      pointer-events: none;
    }

    .slider-handle {
      position: absolute;

      top: 6px;
      left: 6px;

      width: 52px;
      height: 52px;

      background: white;

      border-radius: 50%;

      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.25);

      display: flex;
      align-items: center;
      justify-content: center;

      color: #007bff;

      font-size: 24px;
      font-weight: bold;

      cursor: grab;

      touch-action: none;

      transition:
        left 0.1s,
        transform 0.1s;
    }

    .slider-handle:active {
      cursor: grabbing;
      transform: scale(0.96);
    }

    .slider.disabled {
      background: #bdbdbd;
    }

    .slider.disabled .slider-handle {
      cursor: not-allowed;
      color: #888;
    }

    #status {
      margin-top: 20px;

      min-height: 25px;

      font-size: 17px;

      font-weight: bold;
    }

    .ok {
      color: #198754;
    }

    .error {
      color: #dc3545;
    }

    .info {
      color: #555;
    }

  </style>

</head>


<body>

  <div class="card">

    <h1>🚪 Pedestrian Gate</h1>

    <p>
      Slide the button when you are standing in front of the gate.
    </p>


    <!-- ======================================================
         SLIDER
         ====================================================== -->

    <div
      id="openSlider"
      class="slider"
    >

      <div class="slider-text">
        Slide to open →
      </div>

      <div
        id="sliderHandle"
        class="slider-handle"
      >
        →
      </div>

    </div>


    <div id="status"></div>

  </div>


  <script>

    // ==========================================================
    // CONFIGURATION
    // ==========================================================

    // URL DEL TUO WORKER CLOUDFLARE
    const WORKER_URL =
      "https://cancellino-pedonabile.batnicco2004.workers.dev/";


    // ==========================================================
    // COORDINATES OF THE GATE
    // ==========================================================

    const TARGET_LAT = 43.8206059;
    const TARGET_LON = 11.1387121;


    // Maximum allowed distance
    const MAX_DISTANCE_METERS = 75;


    // ==========================================================
    // CALCULATE GPS DISTANCE
    // ==========================================================

    function calcolaDistanza(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371000;

      const rad = Math.PI / 180;

      const dLat =
        (lat2 - lat1) * rad;

      const dLon =
        (lon2 - lon1) * rad;

      const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

      return (
        R *
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        )
      );
    }


    // ==========================================================
    // MESSAGE
    // ==========================================================

    function mostraMessaggio(
      testo,
      tipo = "info"
    ) {

      const status =
        document.getElementById("status");

      status.innerText = testo;

      status.className = tipo;
    }


    // ==========================================================
    // OPEN GATE
    // ==========================================================

    async function apriCancello() {

      const slider =
        document.getElementById("openSlider");

      const handle =
        document.getElementById("sliderHandle");


      // --------------------------------------------------------
      // 1. CHECK WORKER CONFIGURATION
      // --------------------------------------------------------

      if (
        !WORKER_URL ||
        WORKER_URL.includes("INSERISCI_QUI")
      ) {

        mostraMessaggio(
          "Worker configuration missing.",
          "error"
        );

        resetSlider();

        return;
      }


      // --------------------------------------------------------
      // 2. GET PASS FROM URL
      // --------------------------------------------------------

      const params =
        new URLSearchParams(
          window.location.search
        );

      const pass =
        params.get("pass");


      if (!pass) {

        mostraMessaggio(
          "Invalid link.",
          "error"
        );

        resetSlider();

        return;
      }


      // --------------------------------------------------------
      // 3. CHECK GPS SUPPORT
      // --------------------------------------------------------

      if (!navigator.geolocation) {

        mostraMessaggio(
          "Geolocation is not supported.",
          "error"
        );

        resetSlider();

        return;
      }


      // Disable slider during the procedure
      slider.classList.add("disabled");


      mostraMessaggio(
        "Checking your location...",
        "info"
      );


      // --------------------------------------------------------
      // 4. REQUEST LOCATION
      // --------------------------------------------------------

      navigator.geolocation.getCurrentPosition(

        async (pos) => {

          const userLat =
            pos.coords.latitude;

          const userLon =
            pos.coords.longitude;


          // ----------------------------------------------------
          // 5. LOCAL GPS CHECK
          // ----------------------------------------------------

          const distanza =
            calcolaDistanza(
              userLat,
              userLon,
              TARGET_LAT,
              TARGET_LON
            );


          if (
            distanza >
            MAX_DISTANCE_METERS
          ) {

            mostraMessaggio(
              `You are too far away (${Math.round(distanza)} m).`,
              "error"
            );

            resetSlider();

            return;
          }


          // ----------------------------------------------------
          // 6. SEND REQUEST TO WORKER
          // ----------------------------------------------------

          mostraMessaggio(
            "Opening gate...",
            "info"
          );


          try {

            const response =
              await fetch(
                WORKER_URL,
                {
                  method: "POST",

                  headers: {
                    "Content-Type": "application/json"
                  },

                  body: JSON.stringify({
                    pass: pass,
                    lat: userLat,
                    lon: userLon
                  })
                }
              );


            // --------------------------------------------------
            // 7. READ WORKER RESPONSE
            // --------------------------------------------------

            let data = null;

            try {

              data =
                await response.json();

            } catch (error) {

              data = null;
            }


            // --------------------------------------------------
            // 8. RESULT
            // --------------------------------------------------

            if (
              response.ok &&
              data &&
              data.success
            ) {

              mostraMessaggio(
                "Gate opened!",
                "ok"
              );

            } else {

              mostraMessaggio(
                data?.message ||
                "Access denied.",
                "error"
              );
            }


          } catch (error) {

            console.error(
              "Worker communication error:",
              error
            );

            mostraMessaggio(
              "Connection error.",
              "error"
            );

          } finally {

            resetSlider();

          }

        },


        // ------------------------------------------------------
        // GPS ERROR
        // ------------------------------------------------------

        (error) => {

          console.error(
            "GPS error:",
            error
          );

          let messaggio =
            "Unable to get your location.";

          if (
            error.code ===
            error.PERMISSION_DENIED
          ) {

            messaggio =
              "You must allow location access to open the gate.";

          } else if (
            error.code ===
            error.POSITION_UNAVAILABLE
          ) {

            messaggio =
              "GPS location is not available.";

          } else if (
            error.code ===
            error.TIMEOUT
          ) {

            messaggio =
              "Getting your GPS location took too long.";

          }

          mostraMessaggio(
            messaggio,
            "error"
          );

          resetSlider();

        },


        // ------------------------------------------------------
        // GPS OPTIONS
        // ------------------------------------------------------

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

    }


    // ==========================================================
    // SLIDER LOGIC
    // ==========================================================

    const slider =
      document.getElementById("openSlider");

    const handle =
      document.getElementById("sliderHandle");

    let dragging = false;


    function getPosition(event) {

      if (event.touches) {
        return event.touches[0].clientX;
      }

      return event.clientX;
    }


    function startDrag(event) {

      if (
        slider.classList.contains("disabled")
      ) {
        return;
      }

      dragging = true;

      handle.setPointerCapture?.(
        event.pointerId
      );

      event.preventDefault();
    }


    function moveDrag(event) {

      if (!dragging) {
        return;
      }

      const rect =
        slider.getBoundingClientRect();

      const handleWidth =
        handle.offsetWidth;

      const max =
        rect.width - handleWidth - 12;

      let x =
        getPosition(event) -
        rect.left -
        handleWidth / 2;

      x =
        Math.max(
          6,
          Math.min(x, max)
        );

      handle.style.left =
        `${x}px`;

      event.preventDefault();
    }


    function endDrag() {

      if (!dragging) {
        return;
      }

      dragging = false;

      const rect =
        slider.getBoundingClientRect();

      const handleWidth =
        handle.offsetWidth;

      const max =
        rect.width - handleWidth - 12;

      const current =
        parseFloat(handle.style.left) || 6;


      // Slider completed
      if (current >= max * 0.90) {

        handle.style.left =
          `${max}px`;

        apriCancello();

      } else {

        resetSlider();

      }

    }


    function resetSlider() {

      dragging = false;

      handle.style.left = "6px";

      slider.classList.remove("disabled");

    }


    handle.addEventListener(
      "pointerdown",
      startDrag
    );

    handle.addEventListener(
      "pointermove",
      moveDrag
    );

    handle.addEventListener(
      "pointerup",
      endDrag
    );

    handle.addEventListener(
      "pointercancel",
      endDrag
    );

  </script>

</body>

</html>
