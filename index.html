<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apertura Cancello</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f9;
      color: #222;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 32px 24px;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }
    .description {
      margin: 0 0 28px;
      color: #666;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 14px;
      background: #198754;
      color: white;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover:not(:disabled) {
      background: #157347;
    }
    button:active:not(:disabled) {
      transform: scale(0.98);
    }
    button:disabled {
      background: #bfc3c7;
      cursor: not-allowed;
    }
    #status {
      min-height: 24px;
      margin-top: 22px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
    }
    .ok {
      color: #198754;
    }
    .error {
      color: #dc3545;
    }
    .info {
      color: #555;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🚪 Cancello pedonale</h1>
    <p class="description">
      Premi il pulsante quando sei davanti al cancellino.
    </p>
    <button id="btnOpen" type="button">
      APRI CANCELLO
    </button>
    <div id="status" class="info"></div>
  </main>
  <script>
    // ============================================================
    // CONFIGURAZIONE
    // ============================================================
    const WORKER_URL = "https://cancellino-pedonabile.batnicco2004.workers.dev/";
    
    // Inserisci le coordinate GPS reali del cancello
    const TARGET_LAT = 43.8206059;
    const TARGET_LON = 11.1387121;
    
    // Distanza massima in metri
    const MAX_DISTANCE_METERS = 75;

    // ============================================================
    // ELEMENTI PAGINA
    // ============================================================
    const button = document.getElementById("btnOpen");
    const status = document.getElementById("status");

    // Event listener per il click del pulsante
    button.addEventListener("click", apriCancello);

    function mostraMessaggio(testo, tipo = "info") {
      status.textContent = testo;
      status.className = tipo;
    }

    // Formula di Haversine per calcolo distanza
    function calcolaDistanza(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *
        Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    async function apriCancello() {
      if (!WORKER_URL || WORKER_URL === "INSERISCI_QUI_URL_WORKER") {
        mostraMessaggio("URL del Worker non configurato.", "error");
        return;
      }

      if (!navigator.geolocation) {
        mostraMessaggio("La geolocalizzazione non è supportata dal browser.", "error");
        return;
      }

      button.disabled = true;
      mostraMessaggio("Verifica posizione in corso...", "info");

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const userLat = pos.coords.latitude;
          const userLon = pos.coords.longitude;
          const distanza = calcolaDistanza(userLat, userLon, TARGET_LAT, TARGET_LON);

          if (distanza > MAX_DISTANCE_METERS) {
            mostraMessaggio(`Sei troppo lontano (${Math.round(distanza)}m dal cancello).`, "error");
            button.disabled = false;
            return;
          }

          mostraMessaggio("Invio comando al cancello...", "info");

          try {
            const res = await fetch(WORKER_URL, { method: "POST" });
            const data = await res.json();

            if (res.ok && data.success) {
              mostraMessaggio(data.message || "Cancello aperto!", "ok");
            } else {
              mostraMessaggio(data.message || "Impossibile aprire il cancello.", "error");
            }
          } catch (e) {
            mostraMessaggio("Errore di connessione con il server.", "error");
          } finally {
            button.disabled = false;
          }
        },
        (err) => {
          mostraMessaggio("Attiva il GPS e dai il permesso di rilevare la posizione.", "error");
          button.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }
  </script>
</body>
</html>
